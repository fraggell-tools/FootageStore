services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3700:3700"
    environment:
      - DATABASE_URL=postgresql://footagestore:footagestore@db:5432/footagestore
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - AUTH_TRUST_HOST=true
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
      - GOOGLE_DRIVE_PARENT_FOLDER_ID=${GOOGLE_DRIVE_PARENT_FOLDER_ID}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_NICK_USER_ID=${SLACK_NICK_USER_ID}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      # Brand Kit proxy → Hub (token stays server-side; HUB_BASE_URL defaults to hub.fraggell.com)
      - SOP_SERVICE_TOKEN=${SOP_SERVICE_TOKEN}
      - HUB_BASE_URL=${HUB_BASE_URL:-https://hub.fraggell.com}
    volumes:
      - /mnt/user/appdata/footagestore/data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    # GPU access for NVENC proxy encoding (GTX 1080 Ti via the nvidia runtime).
    # Falls back to libx264 automatically if the GPU/NVENC isn't available.
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - DATABASE_URL=postgresql://footagestore:footagestore@db:5432/footagestore
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN}
      - GOOGLE_DRIVE_PARENT_FOLDER_ID=${GOOGLE_DRIVE_PARENT_FOLDER_ID}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_USER_IDS=${SLACK_USER_IDS}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - ENCODE_THREADS=${ENCODE_THREADS:-8}
      - ENCODE_NICE=${ENCODE_NICE:-10}
      - BACKFILL_CONCURRENCY=${BACKFILL_CONCURRENCY:-4}
      - PROXY_BACKFILL_ON_STARTUP=${PROXY_BACKFILL_ON_STARTUP:-true}
    volumes:
      - /mnt/user/appdata/footagestore/data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=footagestore
      - POSTGRES_PASSWORD=footagestore
      - POSTGRES_DB=footagestore
    volumes:
      - /mnt/user/appdata/footagestore/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footagestore"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    volumes:
      - /mnt/user/appdata/footagestore/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
